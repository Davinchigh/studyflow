services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - study_data:/data
    environment:
      - STUDY_DB_PATH=/data/study_planner.db
      - STUDY_DATA_DIR=/data
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      api:
        condition: service_healthy
volumes:
  study_data:
